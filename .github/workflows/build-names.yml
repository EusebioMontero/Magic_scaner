name: Generar names.json

# Se lanza a mano: Actions → "Generar names.json" → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar nombres de Scryfall
        run: python build_names.py names.json
      - name: Guardar names.json en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add names.json
          git diff --cached --quiet || git commit -m "Actualizar names.json"
          git push
      - name: Pedir el despliegue de Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "/repos/${{ github.repository }}/pages/builds" || true
