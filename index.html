<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Escáner MTG · fase 1</title>
<style>
  :root { --bg:#111418; --card:#1b2027; --fg:#e8ecf1; --muted:#8b96a5; --accent:#ffd23f; --ok:#3ddc84; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; }
  header { display:flex; align-items:baseline; gap:.6rem; padding:.7rem 1rem; }
  header h1 { margin:0; font-size:1.1rem; }
  header span { color:var(--muted); font-size:.85rem; }
  main { max-width:560px; margin:0 auto; padding:0 0 2rem; }

  #stage { position:relative; height:56vh; height:56dvh; min-height:320px; background:#000; overflow:hidden; }
  #video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  #guide { position:absolute; border:2px solid rgba(255,255,255,.85); border-radius:4%;
           box-shadow:0 0 0 9999px rgba(0,0,0,.5); transition:border-color .2s; }
  #guide.ok { border-color:var(--ok); }
  #band { position:absolute; border:2px dashed var(--accent); border-radius:4px;
          display:flex; align-items:center; justify-content:flex-end; padding-right:.4rem;
          color:var(--accent); font-size:.65rem; letter-spacing:.08em; text-transform:uppercase; }

  #status { margin:.8rem 1rem; color:var(--muted); min-height:1.4em; }

  #result { display:flex; gap:1rem; margin:0 1rem 1rem; padding:.8rem; background:var(--card); border-radius:12px; }
  #result[hidden] { display:none; }
  #cardImg { width:38%; max-width:170px; border-radius:6px; align-self:flex-start; background:#000; }
  #result h2 { margin:.1rem 0 .3rem; font-size:1.3rem; }
  #result p { margin:.2rem 0; color:var(--muted); font-size:.9rem; }
  #result a { color:var(--accent); font-size:.9rem; }

  .actions { display:flex; gap:.6rem; padding:0 1rem; }
  button { flex:1; padding:.9rem 1rem; font:inherit; font-weight:600; color:#111; background:var(--accent);
           border:0; border-radius:10px; }
  button:disabled { opacity:.5; }
  button[hidden] { display:none; }

  details { margin:1.2rem 1rem 0; color:var(--muted); font-size:.8rem; }
  pre { white-space:pre-wrap; word-break:break-word; background:var(--card); padding:.6rem; border-radius:8px; }
  #preview { width:100%; background:#fff; border-radius:6px; }
</style>
</head>
<body>
<header><h1>Escáner MTG</h1><span>fase 1 · una carta</span></header>
<main>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <div id="guide"><div id="band"><span>título</span></div></div>
  </div>

  <p id="status">Pulsa «Abrir cámara» y encaja la carta en el marco.</p>

  <section id="result" hidden>
    <img id="cardImg" alt="">
    <div>
      <h2 id="nameMain"></h2>
      <p id="nameSub"></p>
      <p id="meta"></p>
      <a id="link" target="_blank" rel="noopener">Ver en Scryfall</a>
    </div>
  </section>

  <div class="actions">
    <button id="startBtn">Abrir cámara</button>
    <button id="againBtn" hidden>Escanear otra carta</button>
  </div>

  <details>
    <summary>Depuración</summary>
    <pre id="debug">—</pre>
    <canvas id="preview"></canvas>
  </details>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
